<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>マテリアルスイーツ</title>
    <link href="style4.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <h1>素材について</h1>
      <p>伝統と素材にこだわったフルーツを使用したスイーツのお店です</p>
      <img src="images/chestnut1.jpg" alt="栗">
      <img src="images/wheat1.jpg" alt="小麦">
      <img src="images/sugar1.jpg" alt="砂糖">
      <nav>
        <ul>
          <li><a href="#chestnut">栗</a></li>
          <li><a href="#wheat">薄力粉</a></li>
          <li><a href="#sugar">砂糖</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <article>
        <h2>今月のお勧めスイーツ</h2>
        <p>今月おすすめスイーツを紹介します</p>
        <section class="sweets">
          <h3 id="chestnut">栗</h3>
          <p>モンブランの栗は岐阜産を使用しています</p>
          <img src="images/chestnut1.jpg" alt=" 栗の写真">
        </section>
        <section class="sweets">
          <h3 id="wheat">薄力粉</h3>
          <p>薄力粉は全て北海道産を使用しています</p>
          <img src="images/wheat1.jpg" alt="小麦の写真">
        </section
        <section class="sweets">
          <h3 id="sugar">砂糖</h3>
          <p>砂糖は沖縄産と北海道産を使い分けています</p>
          <img src="images/sugar1.jpg" alt="砂糖の写真">
        </section>
      </article>
    </main>
  </body>
</html>
